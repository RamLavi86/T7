<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Site</title>
<style>
  :root {
    --bg: #0f0f10;
    --fg: #f5f5f5;
    --accent: #4f8cff;
    --muted: #a0a0a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    margin-bottom: 0.5rem;
  }
  p {
    color: var(--muted);
    max-width: 32rem;
    line-height: 1.5;
  }
  a.button {
    display: inline-block;
    margin-top: 1.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--accent);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>Hello, World 👋</h1>
  <p>This is a starter page. Edit <code>index.html</code> to make it yours, then push to GitHub to see changes go live.</p>
  <a class="button" href="https://github.com" target="_blank" rel="noopener">Visit GitHub</a>
  <footer>Built with plain HTML &mdash; hosted on GitHub Pages</footer>
</body>
</html>
